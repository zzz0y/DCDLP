name: dcdlp
hidden_dim: 128
branch_dim: 64
num_layers: 2
dropout: 0.3
backbone: gcn
use_interaction: true
interaction_mode: unrestricted
interaction_share_cap: 0.20
interaction_delta_cap: null
lambda_interaction_share: 0.0
lambda_interaction_delta: 0.0
lambda_link: 1.0
score_routing_enabled: false
lambda_score_route: 0.0
lambda_target_response: 0.0
routing_margin_cn: 0.0
routing_margin_degree: 0.0
target_floor_cn: 0.0
target_floor_degree: 0.0
interaction_route_weight: 1.0
routing_finetune_encoder: frozen
encoder_lr_multiplier: 0.1
cn_feature_mode: raw
cn_input_schema: selective_v1
lambda_inv: 0.03
lambda_route: 0.03
lambda_adv: 0.01
lambda_orth: 0.001
lambda_degrob: 0.03
