name: dcdlp
channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.3.1
  - pytorch-cuda=12.1
  - pyg=2.5.3
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.2.2
  - scikit-learn=1.5.1
  - networkx=3.3
  - pyyaml
  - hydra-core
  - joblib
  - pyarrow
  - matplotlib
  - pytest
  - pip
  - pip:
      - ogb==1.3.6
      - wandb==0.17.5
      - torchmetrics==1.4.0
      - optuna==3.6.1
      - pingouin==0.5.4

