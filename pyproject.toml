[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcdlp"
version = "0.1.0"
description = "Degree--Common-neighbor Disentangled Link Prediction experiments"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2.0",
  "scipy>=1.13,<2.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
  "networkx>=3.3,<4.0",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "torch>=2.3,<2.5",
]

[project.optional-dependencies]
full = [
  "torch-geometric>=2.5,<2.7",
  "ogb==1.3.6",
  "pyarrow>=16",
  "hydra-core>=1.3",
  "optuna>=3.6,<4",
  "torchmetrics>=1.4",
  "wandb>=0.17",
  "pingouin>=0.5",
]
test = ["pytest>=8.2", "pytest-cov>=5"]

[project.scripts]
dcdlp = "dcdlp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

